[workspace]
authors = ["Iason Krommydas <iason.krom@gmail.com>", "Mohamed Aly <mohamedaymanali@gmail.com>"]
channels = ["conda-forge"]
name = "hsf-india-mandi-scientific-python"
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks.graphviz-config]
description = "Register the graphviz plugins (pixi skips conda post-link scripts)"
cmd = "dot -c"

[tasks.lab]
description = "Launch Jupyter Lab"
cmd = "jupyter lab"
depends-on = ["graphviz-config"]

[tasks.start]
depends-on = ["lab"]

[dependencies]
python = "3.14.*"
aiohttp = ">=3.14.5,<4"
awkward = ">=2.14.0,<3"
c-compiler = ">=2.0.0,<3"
coffea = ">=2026.9.0,<2027"
correctionlib = ">=2.9.0,<3"
cxx-compiler = ">=2.0.0,<3"
dask = ">=2026.8.0,<2027"
distributed = ">=2026.8.0,<2027"
fsspec = ">=2026.9.0,<2027"
graphviz = ">=14.1.2,<15"
h5py = ">=3.16.0,<4"
hepunits = ">=2.4.7,<3"
hist = ">=2.12.1,<3"
ipykernel = ">=7.4.0,<8"
jupyterlab = ">=4.6.5,<5"
jupyterlab-deck = ">=0.2.0,<0.3"
matplotlib-base = ">=3.11.2,<4"
mplhep = ">=1.3.3,<2"
nbclient = ">=0.11.0,<0.12"
nbformat = ">=5.11.1,<6"
numba = ">=0.68.0,<0.69"
numpy = ">=2.5.4,<3"
pandas = ">=3.1.0,<4"
particle = ">=1.1.0,<2"
pyarrow = ">=26.0.0,<27"
pybind11 = ">=3.1.0,<4"
python-graphviz = ">=0.21,<0.22"
rich = ">=15.0.0,<16"
scipy = ">=1.18.1,<2"
uproot = ">=5.7.7,<6"
vector = ">=1.9.0,<2"

# jaxlib has no conda-forge build for win-64 and no PyPI wheel for osx-64
# xrootd (needed by fsspec-xrootd) has no win-64 build
[target.unix.dependencies]
fsspec-xrootd = ">=0.5.5,<0.6"
jax = ">=0.12.0.1,<0.13"

[target.win-64.pypi-dependencies]
jax = ">=0.12.0.1, <0.13"
