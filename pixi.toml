[workspace]
authors = ["Iason Krommydas <iason.krom@gmail.com>", "Mohamed Aly <mohamedaymanali@gmail.com>"]
channels = ["conda-forge"]
name = "hsf-india-mandi-scientific-python"
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks.lab]
description = "Launch Jupyter Lab"
cmd = "jupyter lab"

[tasks.start]
depends-on = ["lab"]

[dependencies]
python = "3.14.*"
jupyterlab-deck = ">=0.2.0,<0.3"
uproot = ">=5.7.7,<6"
vector = ">=1.9.0,<2"
hist = ">=2.12.1,<3"
particle = ">=1.1.0,<2"
pandas = ">=3.1.0,<4"
pyarrow = ">=26.0.0,<27"
aiohttp = ">=3.14.5,<4"
